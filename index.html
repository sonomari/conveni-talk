<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンビニの店員さんと話そう</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-color: #2d3436;
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background-image: radial-gradient(circle at top right, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh; color: var(--text-color); display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .container {
            max-width: 600px; width: 100%; background: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: var(--shadow);
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 1.8rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-section { margin-bottom: 25px; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #ddd; font-size: 1.1rem; }
        .phrase-item { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .phrase-row { display: flex; justify-content: space-between; align-items: center; }
        .phrase-translated { font-weight: 700; font-size: 1.4rem; }
        .btn-speak { background: var(--primary-gradient); border: none; color: white; width: 54px; height: 54px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>コンビニの店員さんと話そう</h1></header>
        <div class="input-section">
            <input type="text" id="country-input" placeholder="店員さんの国を入力してください" list="country-list">
            <datalist id="country-list">
                <option value="ベトナム"><option value="バングラデシュ"><option value="ネパール"><option value="中国"><option value="インドネシア"><option value="ミャンマー"><option value="フィリピン"><option value="タイ"><option value="韓国">
            </datalist>
        </div>
        <div class="phrase-list">
            <div class="phrase-item">
                <p style="font-size:0.8rem;color:#888;">こんにちは</p>
                <div class="phrase-row"><span class="phrase-translated" id="phrase-hello">-</span><button class="btn-speak" onclick="speak('hello')">▶</button></div>
                <button id="google-hello" class="btn-google" onclick="openGoogle('hello')">Googleで再生</button>
            </div>
            <div class="phrase-item">
                <p style="font-size:0.8rem;color:#888;">お願いします</p>
                <div class="phrase-row"><span class="phrase-translated" id="phrase-please">-</span><button class="btn-speak" onclick="speak('please')">▶</button></div>
                <button id="google-please" class="btn-google" onclick="openGoogle('please')">Googleで再生</button>
            </div>
            <div class="phrase-item">
                <p style="font-size:0.8rem;color:#888;">ありがとう</p>
                <div class="phrase-row"><span class="phrase-translated" id="phrase-thanks">-</span><button class="btn-speak" onclick="speak('thanks')">▶</button></div>
                <button id="google-thanks" class="btn-google" onclick="openGoogle('thanks')">Googleで再生</button>
            </div>
        </div>
        <!-- 隠しオーディオ要素 -->
        <audio id="tts-player" style="display:none;"></audio>
    </div>
    <script>
        const countryData = {
            "ベトナム": { lc: "vi", phrases: { hello: "Xin chào", please: "Làm ơn", thanks: "Cảm ơn" }, fb: { hello: "シンチャオ", please: "ラムオン", thanks: "カムオン" } },
            "バングラデシュ": { lc: "bn", phrases: { hello: "আসসালামু আলাইকুম", please: "দয়া করে", thanks: "ধন্যবাদ" }, fb: { hello: "アッサラーム・アライクム", please: "ドヤ・コレ", thanks: "ドンノバッド" } },
            "ネパール": { lc: "ne", phrases: { hello: "नमस्ते (Namaste)", please: "हजুর (Hajur)", thanks: "धन्यवाद (Dhanyabaad)" }, fb: { hello: "ナマステ", please: "ハジュール", thanks: "ダンネバーッド" } },
            "中国": { lc: "zh", phrases: { hello: "你好", please: "请", thanks: "谢谢" }, fb: { hello: "ニーハオ", please: "チン", thanks: "シェシェ" } },
            "インドネシア": { lc: "id", phrases: { hello: "Halo", please: "Tolong", thanks: "Terima kasih" }, fb: { hello: "ハロー", please: "トロン", thanks: "トゥリマカシ" } },
            "ミャンマー": { lc: "my", phrases: { hello: "မင်္ဂလာပါ", please: "ကျေးဇူးပြု၍", thanks: "ကျေးဇူးတင်ပါတယ်" }, fb: { hello: "ミンガラバー", please: "チェーズーピュユエ", thanks: "チェーズーティンバーデー" } },
            "フィリピン": { lc: "tl", phrases: { hello: "Kumusta", please: "Pakiusap", thanks: "Salamat" }, fb: { hello: "クムスタ", please: "パキウサップ", thanks: "サラマット" } },
            "タイ": { lc: "th", phrases: { hello: "สวัสดี (Sawasdee)", please: "กรุณา", thanks: "ขอบคุณ" }, fb: { hello: "サワディー", please: "カルナー", thanks: "コップン" } },
            "韓国": { lc: "ko", phrases: { hello: "안녕하세요", please: "부탁합니다", thanks: "감사합니다" }, fb: { hello: "アンニョンハセヨ", please: "プタカムニダ", thanks: "カムサハムニダ" } }
        };

        const input = document.getElementById('country-input');
        const player = document.getElementById('tts-player');

        input.addEventListener('input', (e) => {
            const data = countryData[e.target.value.trim()];
            if (data) {
                ['hello', 'please', 'thanks'].forEach(k => {
                    document.getElementById('phrase-' + k).textContent = data.phrases[k];
                    document.getElementById('google-' + k).style.display = 'block';
                });
            }
        });

        function getUrl(key) {
            const data = countryData[input.value.trim()];
            const text = data.phrases[key].split('(')[0].trim();
            return `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${data.lc}&client=gtx`;
        }

        function speak(key) {
            const data = countryData[input.value.trim()];
            if (!data) return;
            const text = data.phrases[key].split('(')[0].trim();
            player.src = getUrl(key);
            player.play().catch(() => {
                // ブロックされたら内蔵音声（カタカナ）
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(data.fb[key]);
                u.lang = 'ja-JP';
                window.speechSynthesis.speak(u);
            });
        }

        function openGoogle(key) {
            window.open(getUrl(key), '_blank');
        }
    </script>
</body>
</html>
