<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コンビニの店員さんと話そう</title>
    <style>
        :root {
            --primary-color: #667eea;
            --text-color: #2d3436;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: radial-gradient(circle at top right, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }
        .container {
            max-width: 600px; width: 100%; 
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary-color); margin-bottom: 5px; }
        .input-section { margin-bottom: 20px; }
        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 10px;
            border: 2px solid #ddd; font-size: 1rem;
        }
        #map-container { 
            width: 100%; height: 200px; border-radius: 15px; 
            overflow: hidden; margin-bottom: 20px; background: #eee;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .info-card { background: #fff; padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #eee; }
        .phrase-item { 
            background: #fff; padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; border: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-speak {
            background: var(--primary-color); border: none; color: white;
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem;
        }
        .btn-link {
            background: #555; color: white; border: none; 
            padding: 15px; border-radius: 10px; cursor: pointer;
            width: 100%; margin-top: 10px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>コンビニの店員さんと話そう</h1></header>
        <div class="input-section">
            <input type="text" id="country-input" placeholder="国名を入力（例：ベトナム）" list="country-list">
            <datalist id="country-list">
                <option value="ベトナム"><option value="バングラデシュ"><option value="ネパール"><option value="中国"><option value="インドネシア"><option value="ミャンマー"><option value="フィリピン"><option value="タイ"><option value="韓国">
            </datalist>
        </div>
        <div id="map-container">
            <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;">国名を入れると地図が出ます</div>
        </div>
        <div class="info-grid">
            <div class="info-card"><p style="font-size:0.7rem;">首都</p><p id="capital-display" style="font-weight:bold;">-</p></div>
            <div class="info-card"><p style="font-size:0.7rem;">言語</p><p id="language-display" style="font-weight:bold;">-</p></div>
        </div>
        <div class="phrase-list">
            <div class="phrase-item">
                <div><p style="font-size:0.7rem;color:#888;">こんにちは</p><p id="phrase-hello" style="font-weight:bold;font-size:1.2rem;">-</p></div>
                <button class="btn-speak" onclick="speak('hello')">▶</button>
            </div>
            <div class="phrase-item">
                <div><p style="font-size:0.7rem;color:#888;">お願いします</p><p id="phrase-please" style="font-weight:bold;font-size:1.2rem;">-</p></div>
                <button class="btn-speak" onclick="speak('please')">▶</button>
            </div>
            <div class="phrase-item">
                <div><p style="font-size:0.7rem;color:#888;">ありがとう</p><p id="phrase-thanks" style="font-weight:bold;font-size:1.2rem;">-</p></div>
                <button class="btn-speak" onclick="speak('thanks')">▶</button>
            </div>
        </div>
        <button class="btn-link" id="btn-translate">Google翻訳を開く</button>
    </div>
